events {
    worker_connections 1024;
}

http {
    server {
        # Il reverse proxy ascolta sulla 8080
        listen 8080;

        # 1. Richieste API: cancella /api/ e gira al backend
        location /api/ {
            # Lo slash finale dopo 8000/ rimuove "/api/" dall'URL inoltrato
            proxy_pass http://backend:8000/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Tutte le altre richieste: girate al frontend sulla porta 80
        location / {
            proxy_pass http://frontend:80;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}